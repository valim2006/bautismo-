<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación al Bautismo de León</title>
    <!-- Google Fonts: Elegant Cursive for Names, Serif for Headings, Sans-serif for buttons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Canvas for floating particles (olive leaves and gold sparkles) -->
    <canvas id="particles-canvas"></canvas>

    <!-- Music Control (Top Right) -->
    <button id="music-toggle" class="music-btn hidden" aria-label="Toggle Music">
        <!-- Speaker Icon (Playing) -->
        <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-volume-2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <!-- Speaker Muted Icon (Muted) -->
        <svg id="icon-sound-off" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-volume-x">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
    </button>

    <!-- Background Music Audio Element -->
    <!-- Fallback to a beautiful public domain piano MP3 if local file is missing -->
    <audio id="bg-music" loop preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
        <source src="https://archive.org/download/jamendo-254907/01-1252238-Maciej%20Bether-Erik%20Satie%20-%20Gymnopedie%20No.1.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-open" src="sfx.mp3" preload="auto"></audio>

    <div class="main-container">
        <!-- Envelope Wrapper (3D context) -->
        <div class="envelope-wrapper" id="envelope-wrapper">
            <!-- Instructions helper before opening -->
            <div class="helper-text" id="helper-text">
                <span class="pulse-text">Toca el sobre para abrir</span>
            </div>

            <div class="envelope" id="envelope">
                <!-- Back flap of the envelope (inside background) -->
                <div class="envelope-back"></div>
                
                <!-- The Letter / Invitation Card -->
                <div class="card" id="invitation-card">
                    <img src="invitacion.png" alt="Invitación al Bautismo de León" class="invitation-img">
                </div>
                
                <!-- Left Flap -->
                <div class="envelope-left"></div>
                
                <!-- Right Flap -->
                <div class="envelope-right"></div>
                
                <!-- Bottom Flap -->
                <div class="envelope-bottom"></div>

                <!-- Top Flap (Lid) -->
                <div class="envelope-top"></div>

                <!-- Wax Seal -->
                <div class="wax-seal" id="wax-seal">
                    <div class="seal-inner">
                        <!-- Dove or Cross icon inside seal -->
                        <svg class="seal-cross" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M11 2h2v7h7v2h-7v11h-2v-11H4V9h7V2z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons Container (Fades in after envelope opens) -->
        <div class="actions-container hidden" id="actions-container">
            <!-- RSVP (WhatsApp) -->
            <a href="#" id="btn-rsvp" class="action-btn rsvp" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                <span>Confirmar Asistencia</span>
            </a>
        </div>
    </div>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
